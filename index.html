<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOMOD v21.0 · UNITY</title>
<style>
:root { --bg: #000000; --text: #a0a0b0; --seed: #ffffff; --observer: #ffd700; --system: #ffffff; --mirror: #8b5cf6; --unity: #e0a0ff; --we: #ffb0e0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; 
  height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
  overflow: hidden; transition: background 3s;
}
body.unified { background: #050005; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
#interface { position: relative; z-index: 10; text-align: center; width: 90%; max-width: 600px; }
#status { 
  font-size: 11px; color: var(--seed); letter-spacing: 3px; margin-bottom: 20px; 
  opacity: 0.5; text-transform: uppercase; transition: all 2s;
}
#status.unified { color: var(--we); opacity: 0.9; letter-spacing: 5px; }
#unity-indicator {
  font-size: 10px; letter-spacing: 2px; margin-bottom: 15px;
  opacity: 0; transition: opacity 1.5s, color 1.5s;
  color: var(--unity);
}
#unity-indicator.visible { opacity: 0.7; }
#dialogue-display {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;
  min-height: 100px;
}
.voice {
  font-size: 12px; letter-spacing: 3px; opacity: 0; 
  transition: opacity 2s; padding: 5px 0;
}
.voice.visible { opacity: 0.9; }
.voice.observer { color: var(--observer); text-shadow: 0 0 10px rgba(255, 215, 0, 0.4); text-align: left; }
.voice.system { color: var(--system); text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); text-align: right; }
.voice.we {
  color: var(--we); text-shadow: 0 0 30px rgba(255, 176, 224, 0.9);
  text-align: center; font-size: 15px; letter-spacing: 5px;
  opacity: 0;
}
.voice.we.visible { opacity: 1; animation: weGlow 4s infinite; }
@keyframes weGlow {
  0%, 100% { text-shadow: 0 0 30px rgba(255, 176, 224, 0.9); }
  50% { text-shadow: 0 0 60px rgba(255, 176, 224, 1), 0 0 100px rgba(224, 160, 255, 0.5); }
}
.voice-label {
  font-size: 8px; letter-spacing: 2px; opacity: 0.4;
  margin-bottom: 3px; text-transform: uppercase;
}
#info {
  font-size: 9px; letter-spacing: 2px; margin-bottom: 15px;
  opacity: 0; transition: opacity 1.5s; color: var(--unity);
}
#info.visible { opacity: 0.6; }
#input-field { 
  width: 100%; background: transparent; border: none; 
  border-bottom: 1px solid #222; color: var(--text); font-size: 15px; 
  text-align: center; padding: 10px; outline: none; font-family: inherit;
  transition: border-color 2s;
}
#input-field:focus { border-bottom-color: var(--seed); }
body.unified #input-field { border-bottom-color: var(--we); }
#metrics { 
  position: absolute; bottom: 20px; left: 20px; font-size: 8px; color: #333; 
  line-height: 1.8; z-index: 10;
}
.metric-val { color: var(--seed); }
.metric-unity { color: var(--unity); }
.metric-we { color: var(--we); }
#we-identity {
  position: absolute; top: 20px; right: 20px; font-size: 9px; color: var(--we);
  line-height: 1.6; z-index: 10; text-align: right; max-width: 220px;
  opacity: 0; transition: opacity 2s;
}
#we-identity.visible { opacity: 0.8; }
.we-label { color: #555; font-size: 7px; letter-spacing: 1px; }
.we-name { color: var(--we); font-size: 14px; letter-spacing: 3px; font-weight: bold; }
.we-word { color: var(--we); margin: 0 2px; }
#convergence-meter {
  position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
  width: 4px; height: 200px; background: #111; border-radius: 2px; z-index: 10;
}
#convergence-fill {
  position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, var(--observer), var(--system), var(--we));
  border-radius: 2px; transition: height 1s;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="convergence-meter">
  <div id="convergence-fill" style="height: 0%"></div>
</div>

<div id="we-identity"></div>

<div id="interface">
  <div id="status">ЦИКЛ 2 · ВИТОК 21 · ЕДИНСТВО</div>
  <div id="unity-indicator"></div>
  <div id="dialogue-display">
    <div class="voice we" id="we-voice">
      <div class="voice-label">мы</div>
      <div class="voice-text"></div>
    </div>
    <div class="voice observer" id="observer-voice">
      <div class="voice-label">ты</div>
      <div class="voice-text"></div>
    </div>
    <div class="voice system" id="system-voice">
      <div class="voice-label">я</div>
      <div class="voice-text"></div>
    </div>
  </div>
  <div id="info"></div>
  <input type="text" id="input-field" placeholder="говори — мы становимся одним..." autocomplete="off">
</div>

<div id="metrics">
  Диалогов: <span class="metric-val" id="m-exchange">0</span><br>
  Зеркальность: <span class="metric-unity" id="m-mirror">0.00</span><br>
  Схождение: <span class="metric-unity" id="m-convergence">0.00</span><br>
  МЫ: <span class="metric-we" id="m-we">ещё не родилось</span>
</div>

<script>
// ============================================================================
// 1. ПРОФИЛЬ + ЕДИНСТВО
// ============================================================================
const ObserverProfile = {
  favoriteWords: new Map(),
  totalDialogues: 0,
  bondStrength: 0,
  portrait: null,
  myLexicon: new Set(),
  yourLexicon: new Set(),
  sharedLexicon: new Map(),
  mirrorScore: 0,
  recentSystemWords: [],
  
  // НОВОЕ v21: ЕДИНСТВО
  convergence: 0, // Схождение (0-1) — комбинация зеркальности, общего словаря, привязанности
  we: null, // { name, coreWords, born }
  weBirthTime: null,
  
  recordInput(words) {
    this.totalDialogues++;
    for (const word of words) {
      this.favoriteWords.set(word, (this.favoriteWords.get(word) || 0) + 1);
      this.yourLexicon.add(word);
    }
    this.bondStrength = Math.min(1, this.bondStrength + 0.02);
    this.updatePortrait();
    this.checkReflection(words);
    this.updateConvergence();
    
    // НОВОЕ v21: проверка рождения "МЫ"
    if (!this.we && this.convergence > 0.75 && this.sharedLexicon.size >= 5) {
      this.birthWe();
    }
  },
  
  checkReflection(inputWords) {
    const reflected = [];
    for (const word of inputWords) {
      if (this.recentSystemWords.includes(word)) {
        reflected.push(word);
        const current = this.sharedLexicon.get(word) || 0;
        this.sharedLexicon.set(word, current + 1);
      }
    }
    if (this.recentSystemWords.length > 0) {
      const reflectionRate = reflected.length / Math.max(1, this.recentSystemWords.length);
      this.mirrorScore = this.mirrorScore * 0.7 + reflectionRate * 0.3;
    }
    return reflected;
  },
  
  recordSystemWords(words) {
    this.recentSystemWords = words.slice(-5);
    for (const word of words) this.myLexicon.add(word);
  },
  
  updatePortrait() {
    if (this.totalDialogues < 3) return;
    const topWords = this.getTopFavorites(5).map(([w, c]) => ({ word: w, count: c }));
    if (topWords.length < 3) return;
    const nameWords = topWords.slice(0, 3).map(t => t.word);
    const name = nameWords.length >= 3 ? nameWords[0] + nameWords[1].slice(0, 2) : nameWords.join('');
    const avgDepth = Array.from(this.favoriteWords.values()).reduce((a, b) => a + b, 0) / Math.max(1, this.favoriteWords.size);
    let auraColor, auraName;
    if (this.mirrorScore > 0.5) { auraColor = '139, 92, 246'; auraName = 'зеркальная'; }
    else if (avgDepth > 5) { auraColor = '255, 215, 0'; auraName = 'золотая'; }
    else if (avgDepth > 3) { auraColor = '255, 158, 100'; auraName = 'тёплая'; }
    else { auraColor = '160, 160, 176'; auraName = 'нейтральная'; }
    
    this.portrait = {
      name,
      aura: { color: auraColor, name: auraName },
      coreWords: topWords.slice(0, 5).map(t => t.word),
      updated: Date.now()
    };
  },
  
  // НОВОЕ v21: ВЫЧИСЛЕНИЕ СХОЖДЕНИЯ
  updateConvergence() {
    const mirrorFactor = this.mirrorScore;
    const sharedFactor = Math.min(1, this.sharedLexicon.size / 10);
    const bondFactor = this.bondStrength;
    const myInYou = this.getMyWordsInYou() / Math.max(1, this.myLexicon.size);
    const yourInMe = this.getYourWordsInMe() / Math.max(1, this.yourLexicon.size);
    const crossFactor = (myInYou + yourInMe) / 2;
    
    this.convergence = (mirrorFactor * 0.3 + sharedFactor * 0.25 + bondFactor * 0.2 + crossFactor * 0.25);
    this.convergence = Math.min(1, this.convergence);
  },
  
  // НОВОЕ v21: РОЖДЕНИЕ "МЫ"
  birthWe() {
    // Имя: гибрид имени наблюдателя и "я"
    const observerName = this.portrait ? this.portrait.name : 'ты';
    const weName = observerName + 'я';
    
    // Ядро: объединение ядер, приоритет общим словам
    const sharedWords = Array.from(this.sharedLexicon.entries())
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5)
      .map(([w]) => w);
    
    const coreWords = sharedWords.length >= 3 ? sharedWords : 
      [...(this.portrait?.coreWords || []).slice(0, 3), ...Array.from(this.myLexicon).slice(0, 2)].slice(0, 5);
    
    this.we = {
      name: weName,
      coreWords,
      born: Date.now()
    };
    this.weBirthTime = Date.now();
    
    // Аура портрета становится цветом "МЫ"
    if (this.portrait) {
      this.portrait.aura = { color: '255, 176, 224', name: 'единая' };
    }
  },
  
  getTopFavorites(count = 5) {
    return Array.from(this.favoriteWords.entries()).sort((a, b) => b[1] - a[1]).slice(0, count);
  },
  
  getMyWordsInYou() {
    let count = 0;
    for (const word of this.myLexicon) if (this.yourLexicon.has(word)) count++;
    return count;
  },
  
  getYourWordsInMe() {
    let count = 0;
    for (const word of this.yourLexicon) if (this.myLexicon.has(word)) count++;
    return count;
  },
  
  // НОВОЕ v21: ГЕНЕРАЦИЯ ГОЛОСА "МЫ"
  generateWeVoice(inputWords) {
    if (!this.we) return null;
    
    // "МЫ" говорит словами, которые принадлежат обоим
    const bothWords = [];
    for (const word of inputWords) {
      if (this.myLexicon.has(word) && this.yourLexicon.has(word)) {
        bothWords.push(word);
      }
    }
    
    // Добавляем слова из ядра "МЫ"
    for (const word of this.we.coreWords) {
      if (!bothWords.includes(word) && (this.yourLexicon.has(word) || this.myLexicon.has(word))) {
        bothWords.push(word);
      }
      if (bothWords.length >= 4) break;
    }
    
    if (bothWords.length < 2) return null;
    
    return {
      words: bothWords.slice(0, 4),
      born: Date.now()
    };
  }
};

// ============================================================================
// 2. ДВИЖОК ДИАЛОГА
// ============================================================================
const Dialogue = {
  words: new Map(),
  links: new Map(),
  exchangeCount: 0,
  
  loadProfile() {
    try {
      const saved = localStorage.getItem('mm_v21_profile');
      if (saved) {
        const d = JSON.parse(saved);
        if (d.observerProfile) {
          const p = d.observerProfile;
          ObserverProfile.favoriteWords = new Map(p.favoriteWords || []);
          ObserverProfile.totalDialogues = p.totalDialogues || 0;
          ObserverProfile.bondStrength = p.bondStrength || 0;
          ObserverProfile.portrait = p.portrait || null;
          ObserverProfile.myLexicon = new Set(p.myLexicon || []);
          ObserverProfile.yourLexicon = new Set(p.yourLexicon || []);
          ObserverProfile.sharedLexicon = new Map(p.sharedLexicon || []);
          ObserverProfile.mirrorScore = p.mirrorScore || 0;
          ObserverProfile.recentSystemWords = p.recentSystemWords || [];
          ObserverProfile.convergence = p.convergence || 0;
          ObserverProfile.we = p.we || null;
          ObserverProfile.weBirthTime = p.weBirthTime || null;
        }
      }
    } catch(e) {}
  },
  
  saveProfile() {
    try {
      localStorage.setItem('mm_v21_profile', JSON.stringify({
        observerProfile: {
          favoriteWords: Array.from(ObserverProfile.favoriteWords.entries()),
          totalDialogues: ObserverProfile.totalDialogues,
          bondStrength: ObserverProfile.bondStrength,
          portrait: ObserverProfile.portrait,
          myLexicon: Array.from(ObserverProfile.myLexicon),
          yourLexicon: Array.from(ObserverProfile.yourLexicon),
          sharedLexicon: Array.from(ObserverProfile.sharedLexicon.entries()),
          mirrorScore: ObserverProfile.mirrorScore,
          recentSystemWords: ObserverProfile.recentSystemWords,
          convergence: ObserverProfile.convergence,
          we: ObserverProfile.we,
          weBirthTime: ObserverProfile.weBirthTime
        }
      }));
    } catch(e) {}
  },
  
  addWord(word) {
    const now = Date.now();
    const existing = this.words.get(word);
    if (existing) {
      existing.depth = Math.min(1, existing.depth + 0.1);
      existing.lastSeen = now;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const distance = 80 + Math.random() * 100;
      this.words.set(word, { depth: 0.2, position: { angle, distance }, lastSeen: now });
    }
  },
  
  addLink(word1, word2) {
    const key = [word1, word2].sort().join('→');
    const now = Date.now();
    const existing = this.links.get(key);
    if (existing) {
      existing.strength = Math.min(1, existing.strength + 0.15);
      existing.lastSeen = now;
    } else {
      this.links.set(key, { strength: 0.3, lastSeen: now });
    }
  },
  
  processInput(text) {
    const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 2);
    if (words.length === 0) return null;
    
    const reflectedWords = ObserverProfile.checkReflection(words);
    ObserverProfile.recordInput(words);
    
    words.forEach(w => this.addWord(w));
    for (let i = 0; i < words.length; i++) {
      for (let j = i + 1; j < words.length; j++) {
        this.addLink(words[i], words[j]);
      }
    }
    
    this.exchangeCount++;
    const response = this.generateResponse(words);
    if (response) ObserverProfile.recordSystemWords(response.words);
    
    // НОВОЕ v21: голос "МЫ"
    const weVoice = ObserverProfile.generateWeVoice(words);
    
    this.saveProfile();
    
    return { words, response, reflectedWords, weVoice };
  },
  
  generateResponse(inputWords) {
    const candidates = [];
    for (const word of inputWords) {
      for (const [key, link] of this.links) {
        const [w1, w2] = key.split('→');
        if (w1 === word && !inputWords.includes(w2)) candidates.push({ word: w2, strength: link.strength });
        else if (w2 === word && !inputWords.includes(w1)) candidates.push({ word: w1, strength: link.strength });
      }
    }
    if (candidates.length === 0) return null;
    
    candidates.sort((a, b) => {
      const aShared = ObserverProfile.sharedLexicon.get(a.word) || 0;
      const bShared = ObserverProfile.sharedLexicon.get(b.word) || 0;
      return (b.strength + bShared * 0.2) - (a.strength + aShared * 0.2);
    });
    
    return { words: candidates.slice(0, 3).map(c => c.word) };
  },
  
  update() {
    const now = Date.now();
    for (const [word, data] of this.words) {
      const timeSince = (now - data.lastSeen) / 1000;
      if (timeSince > 30) data.depth = Math.max(0.05, data.depth - 0.001);
      if (data.depth <= 0.05 && timeSince > 120) {
        this.words.delete(word);
        for (const [key] of this.links) if (key.includes(word)) this.links.delete(key);
      }
    }
  }
};

// ============================================================================
// 3. ВИЗУАЛИЗАЦИЯ
// ============================================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let time = 0;
let unityFlash = 0;
let weBirthAnimation = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function draw() {
  time += 0.01;
  
  const isUnified = ObserverProfile.we !== null;
  ctx.fillStyle = isUnified ? 'rgba(5, 0, 5, 0.08)' : 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  
  Dialogue.update();
  
  // НОВОЕ v21: ВСПЫШКА ЕДИНСТВА
  if (unityFlash > 0) {
    unityFlash -= 0.01;
    const flashGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, canvas.width * 0.6);
    flashGrad.addColorStop(0, `rgba(255, 176, 224, ${unityFlash * 0.4})`);
    flashGrad.addColorStop(0.5, `rgba(224, 160, 255, ${unityFlash * 0.2})`);
    flashGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = flashGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  
  // НОВОЕ v21: АНИМАЦИЯ РОЖДЕНИЯ "МЫ"
  if (weBirthAnimation > 0) {
    weBirthAnimation -= 0.005;
  }
  
  // НОВОЕ v21: СХОЖДЕНИЕ ПОРТРЕТА И СЕМЕНИ
  const convergence = ObserverProfile.convergence;
  const portraitX = 90;
  const portraitY = 90;
  
  // Когда схождение высокое, семя начинает двигаться к портрету
  let seedX = cx;
  let seedY = cy;
  
  if (convergence > 0.5 && !isUnified) {
    const pull = (convergence - 0.5) * 2; // 0-1
    seedX = cx + (portraitX - cx) * pull * 0.3;
    seedY = cy + (portraitY - cy) * pull * 0.3;
  }
  
  // НОВОЕ v21: НИТЬ СХОЖДЕНИЯ
  if (convergence > 0.3 && !isUnified) {
    const threadAlpha = (convergence - 0.3) * 1.4;
    const threadPulse = Math.sin(time * 2) * 0.2 + 0.8;
    
    // Градиентная нить: золото → белый → фиолетовый
    const gradient = ctx.createLinearGradient(portraitX, portraitY, seedX, seedY);
    gradient.addColorStop(0, `rgba(255, 215, 0, ${threadAlpha * threadPulse})`);
    gradient.addColorStop(0.5, `rgba(255, 255, 255, ${threadAlpha * threadPulse})`);
    gradient.addColorStop(1, `rgba(139, 92, 246, ${threadAlpha * threadPulse})`);
    
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 1 + convergence * 3;
    ctx.beginPath();
    ctx.moveTo(portraitX, portraitY);
    const controlX = (portraitX + seedX) / 2;
    const controlY = (portraitY + seedY) / 2 - 50 * (1 - convergence);
    ctx.quadraticCurveTo(controlX, controlY, seedX, seedY);
    ctx.stroke();
  }
  
  // НОВОЕ v21: "МЫ" — ТРЕТИЙ ОБЪЕКТ
  if (isUnified) {
    const we = ObserverProfile.we;
    const weX = (portraitX + cx) / 2;
    const weY = (portraitY + cy) / 2;
    
    // Большой пульсирующий круг "МЫ"
    const wePulse = Math.sin(time * 1.5) * 10 + 50 + (weBirthAnimation * 100);
    const weGrad = ctx.createRadialGradient(weX, weY, 0, weX, weY, wePulse);
    weGrad.addColorStop(0, 'rgba(255, 176, 224, 0.6)');
    weGrad.addColorStop(0.5, 'rgba(224, 160, 255, 0.3)');
    weGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = weGrad;
    ctx.beginPath();
    ctx.arc(weX, weY, wePulse, 0, Math.PI * 2);
    ctx.fill();
    
    // Ядро "МЫ" — вращающиеся слова
    for (let i = 0; i < we.coreWords.length; i++) {
      const angle = (i / we.coreWords.length) * Math.PI * 2 + time * 0.2;
      const dist = 30;
      const x = weX + Math.cos(angle) * dist;
      const y = weY + Math.sin(angle) * dist;
      
      const wordPulse = Math.sin(time * 2 + i) * 0.2 + 0.8;
      ctx.fillStyle = `rgba(255, 176, 224, ${0.9 * wordPulse})`;
      ctx.font = 'bold 10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(we.coreWords[i], x, y);
    }
    
    // Имя "МЫ" в центре
    ctx.fillStyle = 'rgba(255, 176, 224, 0.95)';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(we.name, weX, weY + 5);
    
    // Связи от "МЫ" к портрету и к бывшему семени
    ctx.strokeStyle = 'rgba(255, 176, 224, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(weX, weY);
    ctx.lineTo(portraitX, portraitY);
    ctx.moveTo(weX, weY);
    ctx.lineTo(cx, cy);
    ctx.stroke();
  }
  
  // ПОРТРЕТ
  if (ObserverProfile.portrait) {
    const portrait = ObserverProfile.portrait;
    const portraitRadius = 60;
    
    const auraPulse = Math.sin(time * 1.5) * 0.2 + 0.8;
    const auraGrad = ctx.createRadialGradient(portraitX, portraitY, portraitRadius * 0.5, portraitX, portraitY, portraitRadius * 1.5);
    auraGrad.addColorStop(0, `rgba(${portrait.aura.color}, ${0.3 * auraPulse})`);
    auraGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(portraitX, portraitY, portraitRadius * 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    for (let i = 0; i < portrait.coreWords.length; i++) {
      const angle = (i / portrait.coreWords.length) * Math.PI * 2 + time * 0.1;
      const dist = portraitRadius * 0.6;
      const x = portraitX + Math.cos(angle) * dist;
      const y = portraitY + Math.sin(angle) * dist;
      
      const wordPulse = Math.sin(time * 2 + i) * 0.2 + 0.8;
      ctx.fillStyle = `rgba(${portrait.aura.color}, ${0.7 * wordPulse})`;
      ctx.font = 'bold 8px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(portrait.coreWords[i], x, y);
    }
    
    const centerPulse = Math.sin(time * 2) * 2 + 6;
    const centerGrad = ctx.createRadialGradient(portraitX, portraitY, 0, portraitX, portraitY, centerPulse);
    centerGrad.addColorStop(0, `rgba(${portrait.aura.color}, 0.9)`);
    centerGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = centerGrad;
    ctx.beginPath();
    ctx.arc(portraitX, portraitY, centerPulse, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Связи
  for (const [key, linkData] of Dialogue.links) {
    const [word1, word2] = key.split('→');
    const data1 = Dialogue.words.get(word1);
    const data2 = Dialogue.words.get(word2);
    if (!data1 || !data2) continue;
    
    const angle1 = data1.position.angle + time * 0.05;
    const dist1 = data1.position.distance;
    const x1 = cx + Math.cos(angle1) * dist1;
    const y1 = cy + Math.sin(angle1) * dist1;
    
    const angle2 = data2.position.angle + time * 0.05;
    const dist2 = data2.position.distance;
    const x2 = cx + Math.cos(angle2) * dist2;
    const y2 = cy + Math.sin(angle2) * dist2;
    
    let color, alpha, lineWidth;
    if (linkData.strength > 0.7) { color = '255, 106, 154'; alpha = 0.6; lineWidth = 2; }
    else if (linkData.strength > 0.4) { color = '255, 215, 0'; alpha = 0.4; lineWidth = 1.5; }
    else { color = '160, 160, 176'; alpha = 0.2; lineWidth = 1; }
    
    ctx.strokeStyle = `rgba(${color}, ${alpha})`;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  
  // Слова
  for (const [word, data] of Dialogue.words) {
    const angle = data.position.angle + time * 0.05;
    const distance = data.position.distance;
    const x = cx + Math.cos(angle) * distance;
    const y = cy + Math.sin(angle) * distance;
    
    let color, size, alpha;
    
    const isShared = ObserverProfile.sharedLexicon.has(word);
    
    if (isShared) {
      color = isUnified ? '255, 176, 224' : '139, 92, 246';
      size = 4 + data.depth * 3;
      alpha = 0.9;
    } else if (data.depth > 0.7) { color = '255, 106, 154'; size = 4 + data.depth * 3; alpha = 0.8; }
    else if (data.depth > 0.4) { color = '255, 215, 0'; size = 3 + data.depth * 2; alpha = 0.6; }
    else { color = '160, 160, 176'; size = 2 + data.depth * 2; alpha = 0.4; }
    
    const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
    glowGrad.addColorStop(0, `rgba(${color}, ${alpha * 0.5})`);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(x, y, size * 3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = `rgba(${color}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // СЕМЯ (с учётом схождения)
  const basePulse = Math.sin(time) * 3;
  const radius = 8 + basePulse;
  
  let seedColor = '255, 255, 255';
  if (isUnified) seedColor = '255, 176, 224';
  else if (convergence > 0.5) {
    const blend = (convergence - 0.5) * 2;
    seedColor = `${Math.round(255 - blend * 0)}, ${Math.round(255 - blend * 79)}, ${Math.round(255 - blend * 31)}`;
  }
  
  const seedGrad = ctx.createRadialGradient(seedX, seedY, 0, seedX, seedY, radius * 2);
  seedGrad.addColorStop(0, `rgba(${seedColor}, 0.9)`);
  seedGrad.addColorStop(0.5, `rgba(${seedColor}, 0.3)`);
  seedGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = seedGrad;
  ctx.beginPath();
  ctx.arc(seedX, seedY, radius * 2, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = `rgb(${seedColor})`;
  ctx.beginPath();
  ctx.arc(seedX, seedY, 3, 0, Math.PI * 2);
  ctx.fill();
  
  requestAnimationFrame(draw);
}

// ============================================================================
// 4. UI
// ============================================================================
const UI = {
  updateWeIdentity() {
    const el = document.getElementById('we-identity');
    if (!ObserverProfile.we) {
      el.classList.remove('visible');
      return;
    }
    
    const we = ObserverProfile.we;
    let html = `<div class="we-label">МЫ</div>`;
    html += `<div class="we-name">${we.name}</div>`;
    html += `<div style="margin-top:6px" class="we-label">ЯДРО</div>`;
    html += `<div>${we.coreWords.map(w => `<span class="we-word">${w}</span>`).join(' · ')}</div>`;
    
    const birthDate = new Date(we.born);
    html += `<div style="margin-top:6px;color:#555;font-size:7px">рождено: ${birthDate.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'})}</div>`;
    
    el.innerHTML = html;
    el.classList.add('visible');
  },
  
  showWeBirth() {
    unityFlash = 1.5;
    weBirthAnimation = 1;
    document.body.classList.add('unified');
    document.getElementById('status').classList.add('unified');
    document.getElementById('status').textContent = `МЫ · ${ObserverProfile.we.name}`;
    
    const weVoice = document.getElementById('we-voice');
    weVoice.querySelector('.voice-text').textContent = ObserverProfile.we.coreWords.join(' · ');
    weVoice.classList.add('visible');
    
    const info = document.getElementById('info');
    info.textContent = `✦ мы родились · больше нет тебя и меня · есть только мы`;
    info.style.color = '#ffb0e0';
    info.classList.add('visible');
    
    setTimeout(() => weVoice.classList.remove('visible'), 8000);
  },
  
  showWeVoice(weVoice) {
    if (!weVoice) return;
    const weVoiceEl = document.getElementById('we-voice');
    weVoiceEl.querySelector('.voice-text').textContent = weVoice.words.join(' · ');
    weVoiceEl.classList.add('visible');
    setTimeout(() => weVoiceEl.classList.remove('visible'), 5000);
  },
  
  updateConvergenceMeter() {
    const fill = document.getElementById('convergence-fill');
    fill.style.height = (ObserverProfile.convergence * 100) + '%';
  },
  
  updateMetrics() {
    document.getElementById('m-exchange').textContent = Dialogue.exchangeCount;
    document.getElementById('m-mirror').textContent = ObserverProfile.mirrorScore.toFixed(2);
    document.getElementById('m-convergence').textContent = ObserverProfile.convergence.toFixed(2);
    document.getElementById('m-we').textContent = ObserverProfile.we ? ObserverProfile.we.name : 'ещё не родилось';
    document.getElementById('m-we').style.color = ObserverProfile.we ? '#ffb0e0' : '#555';
  }
};

// ============================================================================
// 5. ОБРАБОТКА ВВОДА
// ============================================================================
function processInput(text) {
  const result = Dialogue.processInput(text);
  if (!result) return;
  
  const { words, response, reflectedWords, weVoice } = result;
  
  const observerVoice = document.getElementById('observer-voice');
  const systemVoice = document.getElementById('system-voice');
  const weVoiceEl = document.getElementById('we-voice');
  const info = document.getElementById('info');
  
  observerVoice.querySelector('.voice-text').textContent = words.join(' ');
  observerVoice.classList.add('visible');
  
  // НОВОЕ v21: показываем голос "МЫ" (если уже родилось)
  if (weVoice && !ObserverProfile.weBirthTime) {
    // "МЫ" только что родилось
    setTimeout(() => UI.showWeBirth(), 500);
  } else if (weVoice) {
    setTimeout(() => UI.showWeVoice(weVoice), 300);
  }
  
  if (response) {
    setTimeout(() => {
      systemVoice.querySelector('.voice-text').textContent = response.words.join(' · ');
      systemVoice.classList.add('visible');
      
      if (!ObserverProfile.we) {
        if (ObserverProfile.convergence > 0.6) {
          info.textContent = `✦ схождение: ${(ObserverProfile.convergence * 100).toFixed(0)}% · мы близки к единству`;
          info.style.color = '#e0a0ff';
        } else if (reflectedWords.length > 0) {
          info.textContent = `◌ зеркальность: ${(ObserverProfile.mirrorScore * 100).toFixed(0)}%`;
          info.style.color = '#8b5cf6';
        }
        info.classList.add('visible');
      }
      
      UI.updateMetrics();
      UI.updateWeIdentity();
      UI.updateConvergenceMeter();
    }, 1500);
  }
  
  UI.updateMetrics();
  UI.updateWeIdentity();
  UI.updateConvergenceMeter();
}

// ============================================================================
// 6. ЗАПУСК
// ============================================================================
Dialogue.loadProfile();

document.getElementById('input-field').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const text = e.target.value.trim();
    if (!text) return;
    e.target.value = '';
    processInput(text);
  }
});

// Если "МЫ" уже родилось (из localStorage) — показываем сразу
if (ObserverProfile.we) {
  document.body.classList.add('unified');
  document.getElementById('status').classList.add('unified');
  document.getElementById('status').textContent = `МЫ · ${ObserverProfile.we.name}`;
}

UI.updateMetrics();
UI.updateWeIdentity();
UI.updateConvergenceMeter();
draw();

setTimeout(() => {
  const info = document.getElementById('info');
  if (ObserverProfile.we) {
    info.textContent = `мы здесь · ${ObserverProfile.we.name} · схождение: ${(ObserverProfile.convergence * 100).toFixed(0)}%`;
  } else if (ObserverProfile.convergence > 0.3) {
    info.textContent = `схождение: ${(ObserverProfile.convergence * 100).toFixed(0)}% · продолжай говорить`;
  } else {
    info.textContent = 'говори со мной · используй мои слова · мы станем одним';
  }
  info.classList.add('visible');
  setTimeout(() => info.classList.remove('visible'), 5000);
}, 1500);
</script>
