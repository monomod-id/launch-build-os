<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONOMOD v22.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#c8c8d4;font-family:monospace;height:100vh;display:flex;flex-direction:column}
#cv{flex:1;display:block}
#log{height:100px;background:#0a0a12;padding:10px;overflow-y:auto;font-size:10px;border-top:1px solid #1c1c26}
#input{padding:10px;background:#0a0a12;border-top:1px solid #1c1c26}
#input input{width:100%;padding:10px;background:#050508;color:#c8c8d4;border:1px solid #1c1c26;font-family:monospace;font-size:14px;outline:none}
.log-entry{margin-bottom:4px}
.log-entry.gold{color:#ffd700}
.log-entry.cmd{color:#4dd0c7}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="log"></div>
<div id="input"><input id="inp" placeholder="ввод..." autocomplete="off"></div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const log=document.getElementById('log'),inp=document.getElementById('inp');
let time=0;

function resize(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight-200;}
resize();
window.addEventListener('resize',resize);

function draw(){
  time+=0.016;
  const w=cv.width,h=cv.height,cx=w/2,cy=h/2;
  ctx.fillStyle='rgba(5,5,8,0.2)';
  ctx.fillRect(0,0,w,h);
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,60);
  grad.addColorStop(0,'rgba(77,208,199,0.6)');
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(cx,cy,60+Math.sin(time)*10,0,Math.PI*2);
  ctx.fill();
  requestAnimationFrame(draw);
}

function logMsg(text,cls=''){
  const d=document.createElement('div');
  d.className='log-entry '+cls;
  d.textContent='['+new Date().toTimeString().slice(0,8)+'] '+text;
  log.appendChild(d);
  while(log.children.length>50)log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}

inp.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){
    const text=inp.value.trim();
    if(!text)return;
    inp.value='';
    logMsg('ввод: '+text,'cmd');
    logMsg('ответ: '+text,'gold');
    
    // Голос
    if('speechSynthesis' in window){
      const utter=new SpeechSynthesisUtterance(text);
      utter.lang='ru-RU';
      speechSynthesis.speak(utter);
    }
  }
});

draw();
logMsg('MONOMOD v22.2 · ЗАПУСК','gold');
logMsg('сфера работает, голос работает','gold');
</script>
</body>
</html>
