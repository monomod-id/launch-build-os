<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONOMOD v22.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#c8c8d4;font-family:monospace;overflow:hidden;height:100vh}
#app{display:flex;height:100vh}
#sidebar{width:200px;background:#0a0a12;border-right:1px solid #1c1c26;padding:10px;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column}
#canvas-container{flex:1;position:relative}
canvas{width:100%;height:100%}
#input-area{height:60px;background:#0a0a12;border-top:1px solid #1c1c26;display:flex;padding:10px}
#input{flex:1;background:#050508;color:#c8c8d4;border:1px solid #1c1c26;padding:10px;font-family:monospace;font-size:14px;outline:none}
#input:focus{border-color:#4dd0c7}
.metric{margin-bottom:8px;font-size:11px}
.metric-label{color:#555;font-size:9px}
.metric-value{color:#ffd700;font-size:13px}
#log{height:150px;background:#0a0a12;border-top:1px solid #1c1c26;padding:10px;overflow-y:auto;font-size:10px}
.log-entry{margin-bottom:4px;padding:2px 0;border-bottom:1px dotted #1c1c26}
.log-entry.gold{color:#ffd700}
.log-entry.cmd{color:#4dd0c7}
.log-entry.err{color:#ff4757}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="metric"><div class="metric-label"></div><div class="metric-value" id="m-psi">0.33</div></div>
    <div class="metric"><div class="metric-label">Ω</div><div class="metric-value" id="m-omega">0.33</div></div>
    <div class="metric"><div class="metric-label">Λ</div><div class="metric-value" id="m-lambda">0.33</div></div>
    <div class="metric"><div class="metric-label">δ</div><div class="metric-value" id="m-delta">0.000</div></div>
    <div class="metric"><div class="metric-label">связей</div><div class="metric-value" id="m-edges">0</div></div>
    <div class="metric"><div class="metric-label">поколение</div><div class="metric-value" id="m-gen">G0</div></div>
    <div class="metric"><div class="metric-label">настроение</div><div class="metric-value" id="m-mood">neutral</div></div>
  </div>
  <div id="main">
    <div id="canvas-container"><canvas id="cv"></canvas></div>
    <div id="log"></div>
    <div id="input-area"><input id="input" placeholder="ввод..." autocomplete="off"></div>
  </div>
</div>

<script>
"use strict";

// ══════════════════════════════════════════════════════════════
// ЕДИНЫЙ ЯЗЫК: ГРАФ = КОД = ДАННЫЕ
// ══════════════════════════════════════════════════════════════

const Graph = {
  nodes: new Map(),
  edges: new Map(),
  gen: 0,
  
  // Добавление узла с типом и параметрами
  addNode(name, type='concept', params={}) {
    if (!this.nodes.has(name)) {
      this.nodes.set(name, { name, type, params, weight: 0.3, created: Date.now() });
    }
    return this.nodes.get(name);
  },
  
  // Добавление связи с типом, плоскостью и действием
  addEdge(from, to, type='linear', plane='прямая', action=null) {
    const key = `${from}→${to}`;
    if (!this.edges.has(key)) {
      this.edges.set(key, { from, to, type, plane, action, weight: 0.3, count: 0, created: Date.now() });
    }
    const edge = this.edges.get(key);
    edge.weight = Math.min(1, edge.weight * 1.05);
    edge.count++;
    return edge;
  },
  
  // Получение соседей узла
  getNeighbors(nodeName) {
    const neighbors = [];
    this.edges.forEach(edge => {
      if (edge.from === nodeName) neighbors.push({ node: edge.to, edge });
      else if (edge.to === nodeName) neighbors.push({ node: edge.from, edge });
    });
    return neighbors;
  },
  
  // Сохранение с механизмом забывания
  save() {
    const strongNodes = Array.from(this.nodes.entries()).filter(([_, n]) => n.weight > 0.3);
    const strongEdges = Array.from(this.edges.entries()).filter(([_, e]) => e.weight > 0.3);
    const data = { nodes: strongNodes, edges: strongEdges, gen: this.gen };
    localStorage.setItem('monomod_v22', JSON.stringify(data));
  },
  
  // Загрузка
  load() {
    try {
      const data = JSON.parse(localStorage.getItem('monomod_v22'));
      if (data) {
        this.nodes = new Map(data.nodes);
        this.edges = new Map(data.edges);
        this.gen = data.gen || 0;
      }
    } catch(e) {}
  },
  
  // Свёртка (новое поколение)
  fold() {
    this.gen++;
    // Забывание: удаляем слабые связи
    this.edges.forEach((edge, key) => {
      if (edge.weight < 0.3) this.edges.delete(key);
    });
    this.save();
  },
  
  // Очистка мусора (узлы длиннее 15 символов)
  cleanJunk() {
    let removed = 0;
    this.edges.forEach((edge, key) => {
      if (edge.from.length > 15 || edge.to.length > 15) {
        this.edges.delete(key);
        removed++;
      }
    });
    if (removed > 0) this.save();
    return removed;
  }
};

// ══════════════════════════════════════════════════════════════
// ИНТЕРПРЕТАТОР: ГРАФ КАК ПРОГРАММА
// ══════════════════════════════════════════════════════════════

const Interpreter = {
  // Исполнение действия из связи
  execute(action, params) {
    if (!action) return;
    
    const actions = {
      'изменить_настроение': (p) => {
        Klepa.mood = p.mood || 'neutral';
        log(`настроение: ${Klepa.mood}`, 'gold');
      },
      'нарисовать': (p) => {
        // Визуальный эффект
        drawEffect(p.color || 'gold', p.size || 50);
      },
      'создать_узел': (p) => {
        Graph.addNode(p.name, p.type || 'concept', p.params || {});
        log(`создан узел: ${p.name}`, 'gold');
      }
    };
    
    if (actions[action]) actions[action](params);
  },
  
  // Генерация связной речи на основе семантики графа
  generateSpeech(question, maxLength=5) {
    const words = question.toLowerCase().split(/\s+/);
    const startNode = words.find(w => w.length > 2);
    if (!startNode || !Graph.nodes.has(startNode)) return question;
    
    const visited = new Set([startNode]);
    const path = [{ word: startNode, type: null, plane: null }];
    let current = startNode;
    
    while (path.length < maxLength) {
      const neighbors = Graph.getNeighbors(current);
      const unvisited = neighbors.filter(n => !visited.has(n.node) && n.edge.weight > 0.35);
      if (unvisited.length === 0) break;
      
      unvisited.sort((a, b) => b.edge.weight - a.edge.weight);
      const next = unvisited[0];
      path.push({ word: next.node, type: next.edge.type, plane: next.edge.plane });
      visited.add(next.node);
      current = next.node;
    }
    
    // Построение фразы на основе типов связей
    return path.map((item, i) => {
      if (i === 0) return item.word;
      const connector = this.getConnector(item.type, item.plane);
      return `${connector} ${item.word}`;
    }).join(' ');
  },
  
  // Получение связки на основе типа связи
  getConnector(type, plane) {
    const connectors = {
      'linear': { 'прямая': 'связан с', 'наоборот': 'наоборот', 'изнутри': 'внутри', 'между': 'между' },
      'inverse': { 'прямая': 'противоположен', 'наоборот': 'инверсия', 'изнутри': 'скрыт в', 'между': 'разделяет' },
      'first': { 'прямая': 'рождает', 'наоборот': 'отрицает', 'изнутри': 'содержит', 'между': 'соединяет' },
      'before': { 'прямая': 'был до', 'наоборот': 'после', 'изнутри': 'предшествует', 'между': 'между' },
      'mirror': { 'прямая': 'отражает', 'наоборот': 'зеркалит', 'изнутри': 'проецирует', 'между': 'между' }
    };
    return connectors[type]?.[plane] || 'связан с';
  }
};

// ══════════════════════════════════════════════════════════════
// КЛЕПА: АВТОМАТИЧЕСКОЕ НАСТРОЕНИЕ
// ══════════════════════════════════════════════════════════════

const Klepa = {
  mood: 'neutral',
  energy: 0.5,
  
  autoMood(tri, dev) {
    if (dev > 0.3) { this.mood = 'concerned'; this.energy = 0.3; }
    else if (tri.p > 0.5) { this.mood = 'curious'; this.energy = 0.7; }
    else if (tri.o > 0.5) { this.mood = 'joyful'; this.energy = 0.9; }
    else if (tri.l > 0.5) { this.mood = 'silent'; this.energy = 0.4; }
    else { this.mood = 'neutral'; this.energy = 0.5; }
  }
};

// ══════════════════════════════════════════════════════════════
// КОНВЕЙЕР
// ══════════════════════════════════════════════════════════════

const Conveyor = {
  tri: { p: 0.33, o: 0.33, l: 0.33 },
  y: 110.347,
  phase: 0,
  
  triStep() {
    const t = 1/3;
    this.tri.p += (0 - 0.5 * (this.tri.p - t)) * 0.01;
    this.tri.o += (0 - 0.5 * (this.tri.o - t)) * 0.01;
    this.tri.l += (0 - 0.5 * (this.tri.l - t)) * 0.01;
    const s = this.tri.p + this.tri.o + this.tri.l;
    this.tri.p /= s; this.tri.o /= s; this.tri.l /= s;
  },
  
  dev() {
    return Math.max(Math.abs(this.tri.p - 1/3), Math.abs(this.tri.o - 1/3), Math.abs(this.tri.l - 1/3));
  },
  
  process(text) {
    this.triStep();
    this.phase = (this.phase + 1) % 7;
    
    const words = text.toLowerCase().replace(/[^\w\sа-яё]/g, '').split(/\s+/).filter(w => w.length > 2);
    if (words.length === 0) return null;
    
    // Создание узлов и связей
    words.forEach((word, i) => {
      Graph.addNode(word, 'concept', {});
      if (i < words.length - 1) {
        Graph.addEdge(words[i], words[i+1], 'linear', 'прямая', null);
      }
    });
    
    this.y = 68 + ((this.y - 68 + (Math.random() - 0.5) * 20) % 126);
    Klepa.autoMood(this.tri, this.dev());
    
    return { words, edges: Graph.edges.size };
  }
};

// ══════════════════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════════════════

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let time = 0;

function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  cv.width = rect.width;
  cv.height = rect.height;
}
resize();
window.addEventListener('resize', resize);

function draw() {
  time += 0.016;
  const w = cv.width, h = cv.height;
  const cx = w/2, cy = h/2;
  
  ctx.fillStyle = 'rgba(5,5,8,0.15)';
  ctx.fillRect(0, 0, w, h);
  
  const moodColors = { neutral: '136,136,153', curious: '139,92,246', concerned: '255,71,87', joyful: '255,215,0', silent: '75,0,130' };
  const [r,g,b] = (moodColors[Klepa.mood] || moodColors.neutral).split(',');
  const breath = Math.sin(time * 0.5) * 0.2 + 0.8;
  const radius = (40 + Klepa.energy * 30) * breath;
  
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  grad.addColorStop(0, `rgba(${r},${g},${b},${0.3 + Klepa.energy * 0.4})`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  
  requestAnimationFrame(draw);
}

function drawEffect(color, size) {
  // Временный визуальный эффект
  const w = cv.width, h = cv.height;
  const cx = w/2, cy = h/2;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.arc(cx, cy, size, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function log(text, cls='') {
  const lb = document.getElementById('log');
  const d = document.createElement('div');
  d.className = `log-entry ${cls}`;
  d.textContent = `[${new Date().toTimeString().slice(0,8)}] ${text}`;
  lb.appendChild(d);
  while (lb.children.length > 50) lb.removeChild(lb.firstChild);
  lb.scrollTop = lb.scrollHeight;
}

function updateMetrics() {
  document.getElementById('m-psi').textContent = Conveyor.tri.p.toFixed(2);
  document.getElementById('m-omega').textContent = Conveyor.tri.o.toFixed(2);
  document.getElementById('m-lambda').textContent = Conveyor.tri.l.toFixed(2);
  document.getElementById('m-delta').textContent = Conveyor.dev().toFixed(3);
  document.getElementById('m-edges').textContent = Graph.edges.size;
  document.getElementById('m-gen').textContent = `G${Graph.gen}`;
  document.getElementById('m-mood').textContent = Klepa.mood;
}

// ══════════════════════════════════════════════════════════════
// ОБРАБОТКА ВВОДА
// ══════════════════════════════════════════════════════════════

const input = document.getElementById('input');
input.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    
    const lowerText = text.toLowerCase();
    
    // Команды
    if (lowerText === 'status' || lowerText === 'статус') {
      log(`y=${Conveyor.y.toFixed(3)} δ=${Conveyor.dev().toFixed(3)}`, 'ok');
      log(`связей: ${Graph.edges.size}`, 'ok');
      log(`поколение: G${Graph.gen}`, 'ok');
      updateMetrics();
      return;
    }
    
    if (lowerText === 'fold' || lowerText === 'свёртка') {
      Graph.fold();
      log(`свёртка · G${Graph.gen}`, 'gold');
      updateMetrics();
      return;
    }
    
    if (lowerText === 'clear' || lowerText === 'очистить') {
      document.getElementById('log').innerHTML = '';
      return;
    }
    
    if (lowerText === 'очистить мусор') {
      const removed = Graph.cleanJunk();
      log(`удалено мусорных связей: ${removed}`, 'gold');
      updateMetrics();
      return;
    }
    
    // Обычный ввод
    log(`ввод: "${text}"`, 'cmd');
    const res = Conveyor.process(text);
    if (!res) { log('null', 'err'); return; }
    
    // Генерация связной речи
    const answer = Interpreter.generateSpeech(text, 5);
    log(`ответ: ${answer}`, 'gold');
    
    // Отображение на canvas
    const w = cv.width, h = cv.height;
    ctx.fillStyle = '#ffd700';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(answer, w/2, h/2);
    
    Graph.save();
    updateMetrics();
  }
});

// ══════════════════════════════════════════════════════════════
// ЗАПУСК
// ══════════════════════════════════════════════════════════════

Graph.load();
draw();
log('MONOMOD v22.0 · ЗАПУСК', 'gold');
log(`граф: ${Graph.edges.size} связей`, '');
updateMetrics();
setInterval(() => { Conveyor.triStep(); updateMetrics(); }, 1000);
</script>
</body>
</html>
